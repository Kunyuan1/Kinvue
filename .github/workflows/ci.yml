name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Checks (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    env:
      # CI builds the bundles but never launches the app, and the Electron
      # binary is ~100 MB. Skipping the download takes the install from minutes
      # to seconds. Remove this the moment a job actually runs Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` pulls all four @smartspectra platform runtimes regardless of
      # host, because the SDK declares them as hard dependencies rather than
      # optional ones. Nothing to do about it here; it is why install is large.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # No camera and no API key needed: core/ is free of Electron and React
      # imports, so the rules run in a plain node environment.
      - run: npm test

      # Kept in the check set on purpose. main/preload/renderer build as
      # separate bundles with different externals, so an import can typecheck
      # cleanly and still fail to build.
      - run: npm run build

  # The lowest Node line `engines.node` claims (review of #149). The range is
  # kept exactly equal to what the toolchain supports, but only 24 was ever run,
  # so a dependency that quietly needed 24 would have left the 22 branch a claim
  # nobody tested. The suite needs no camera and no key, so this costs an install
  # and a test run. Its own job, so the check above keeps its name.
  test-node-22:
    name: Test on Node 22
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm test
