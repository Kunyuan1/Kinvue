version: 2
updates:
  # Scheduled version updates only. Responding to a published advisory is
  # Dependabot alerts and security updates, which are repository settings and
  # not something this file can turn on. Whether this file's `ignore` rules
  # also hold back a *security* update is not settled: GitHub's options
  # reference marks `ignore` version-updates-only, while its security-updates
  # page configures ignores for them. Assume it might.
  - package-ecosystem: npm
    directory: /
    # Explicit rather than `auto`, because the pins below depend on it: `increase`
    # rewrites an exact requirement to the new exact version. `widen` would write
    # the old pin `||` the new one inside the very PR meant to protect the pin
    # (KV-131).
    versioning-strategy: increase
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # `@types/node` is held to the Node major Electron ships (24 on Electron
      # 44), not the newest Node. Types a major ahead would let code compile
      # against APIs that no runtime here has, and CI stays green until
      # something uses one. So no major bumps: move it by hand when an Electron
      # bump moves its Node major (its `DEPS` `node_version`, see README), and
      # with it `TYPES_NODE_MAJOR` in tests/pins.test.ts, which checks both.
      #
      # What this does *not* buy (review of #150):
      # - **Node 22.** `engines.node` also claims 22, and `core/` runs there
      #   too, so 24's types still let a 24-only API through; only code the
      #   tests run is checked on 22, by the Node 22 CI job.
      # - **Minor drift.** A types minor tracks a Node minor, and minors still
      #   arrive, grouped. Once `@types/node` passes the minor Electron vendors
      #   (24.21 on 44.4.4), main-process code can typecheck against an API
      #   Electron's Node lacks. Read that group's `@types/node` line.
      #
      # Closing a PR for one major only silences that major, which is why a
      # rule and not a closed PR: 25 was proposed after 26 was closed.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: ["chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Routine bumps arrive as one PR. Majors arrive one at a time, because a
      # major Electron, Vite or React release is a change to review, not a chore.
      #
      # Electron and the SDK are left out, so each of their bumps arrives alone:
      # an Electron security patch cannot be held up by an unrelated failure in
      # the group, and an SDK release, which can change what the capture sends
      # over the network, is never hidden inside a chore. Neither is proven by a
      # green CI run — see README "Conventions & Workflow".
      #
      # Both are pinned exactly in package.json, not with a caret (KV-131), so
      # npm will not pick up a new one on its own. With `^`, `npm update` would
      # move either inside a few hundred lines of package-lock.json churn, in a
      # PR about something else, with no app run and no capture checked against
      # the privacy claims — a version change nobody read. Dependabot rewrites
      # an exact pin (see `versioning-strategy`), so nothing is lost, and
      # tests/pins.test.ts fails if either is relaxed back to a range.
      #
      # Why these two and not every package CI cannot run: CI cannot prove
      # Electron's Node version, and so the native ABI the SDK's runtime loads
      # against, nor the SDK's network behaviour. A bundler or plugin minor
      # changes build output the build and tests do check. That is the line —
      # do not pin package by package past it, or reach for `save-exact`.
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["electron", "@smartspectra/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["ci"]
    commit-message:
      prefix: "ci(deps)"
