name: Ticket
description: A unit of work. One ticket is roughly one PR.
title: "KV-##: "
body:
  - type: markdown
    attributes:
      value: |
        A ticket's KV number **is** its issue number, which GitHub assigns when you submit.
        Leave `KV-##` in the title: it is filled in with that number automatically — KV-31 is #31.

        Set the milestone to the phase this belongs to. Add `backlog` if its phase has not started.

  - type: textarea
    id: problem
    attributes:
      label: What and why
      description: >
        The problem, with the evidence — a file and line, or the numbers from actually running it.
        "This seems wrong" is not yet a ticket.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Outcomes a reviewer can tick. If it cannot be checked, it cannot be closed.
      # A placeholder, not a value: GitHub counts a pre-filled value as an answer,
      # which would let `required` pass on an untouched field.
      placeholder: |
        - [ ] An outcome a reviewer can check
    validations:
      required: true

  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: "Other tickets as #N, and why. Leave blank if none."

  # Mirrors "Does this change what the app claims?" in
  # .github/pull_request_template.md. Change both together.
  - type: checkboxes
    id: claims
    attributes:
      label: Does this change what the app claims?
      description: Any of these means the PR has to answer for it. The PR template says what each one needs.
      options:
        - label: Changes when a session is flagged, or what a flag means
        - label: Changes a tuned constant (threshold, window, severity weight)
        - label: Touches the privacy surface — telemetry, the preload bridge, where the API key lives
        - label: Changes what leaves the device, or what could once remote access exists
        - label: Changes the shape of a stored record
        - label: Changes wording the caregiver or the cared-for person reads
